name: Build and publish images

on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: git.homeserv.uk
  APP_IMAGE: git.homeserv.uk/jacobomara901/evergreen-testing
  DB_IMAGE: git.homeserv.uk/jacobomara901/evergreen-testing-db
  EG_REF: rel_3_17
  OSRF_REF: main
  EG_STAFF_CLIENT: '1'
  EG_SAMPLE_DATA: concerto_enhanced

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Delete the preinstalled SDKs to free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Work out the image tags
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_USER }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Build and push the Evergreen image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            EG_REF=${{ env.EG_REF }}
            OSRF_REF=${{ env.OSRF_REF }}
            EG_STAFF_CLIENT=${{ env.EG_STAFF_CLIENT }}
          tags: |
            ${{ env.APP_IMAGE }}:latest-${{ matrix.arch }}
            ${{ env.APP_IMAGE }}:${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.APP_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.APP_IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Build and push the database image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: db
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            EG_REF=${{ env.EG_REF }}
            OSRF_REF=${{ env.OSRF_REF }}
            EG_STAFF_CLIENT=${{ env.EG_STAFF_CLIENT }}
            EG_SAMPLE_DATA=${{ env.EG_SAMPLE_DATA }}
          tags: |
            ${{ env.DB_IMAGE }}:latest-${{ matrix.arch }}
            ${{ env.DB_IMAGE }}:${{ steps.vars.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: |
            type=registry,ref=${{ env.DB_IMAGE }}:buildcache-${{ matrix.arch }}
            type=registry,ref=${{ env.APP_IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.DB_IMAGE }}:buildcache-${{ matrix.arch }},mode=max

  manifest:
    name: Publish multi-arch manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build
    steps:
      - name: Work out the image tags
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.FORGEJO_USER }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Join the per-arch tags into latest and the commit tag
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          for image in "$APP_IMAGE" "$DB_IMAGE"; do
            docker buildx imagetools create \
              --tag "$image:latest" \
              "$image:latest-amd64" \
              "$image:latest-arm64"
            docker buildx imagetools create \
              --tag "$image:$SHORT_SHA" \
              "$image:$SHORT_SHA-amd64" \
              "$image:$SHORT_SHA-arm64"
          done
